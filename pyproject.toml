[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semmelweis-handwashing-discovery"
version = "0.1.0"
description = "Udemy 100 Days of Code, Day 80: Dr Semmelweis and the discovery of handwashing, analysed with pandas, Matplotlib and SciPy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2.3",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "plotly>=5.24",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semmelweis = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
